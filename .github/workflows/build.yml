
name: Build ShadowPurge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ShadowPurge.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: unzip ShadowPurge.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/ShadowPurge
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowPurge-APK
          path: extracted/ShadowPurge/app/build/outputs/apk/debug/app-debug.apk
